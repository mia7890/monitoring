# Nixpacks configuration for Laravel PHP 8.2 with PostgreSQL
[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs_20']

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction'
]

[start]
cmd = 'php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
